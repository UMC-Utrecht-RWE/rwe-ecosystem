on:
  workflow_call:
    inputs:
      matrix:
        description: JSON array of {os, r} configurations to check on.
        type: string
        default: >-
          [
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]
      error-on:
        description: Lowest R CMD check severity that fails the job ('"note"', '"warning"' or '"error"').
        type: string
        default: '"warning"'
      working-directory:
        description: Folder that holds the package, relative to the repository root.
        type: string
        default: '.'

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: ${{ inputs.working-directory }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: ${{ inputs.error-on }}
          working-directory: ${{ inputs.working-directory }}
