on:
  workflow_call:

name: Code Quality

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Code
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: check

      - name: Lint with lintr
        run: |
          lints <- lintr::lint_package()
          print(lints)
          # Fail if there are any lints
          if (length(lints) > 0L) {
            quit(status = 1)
          }
        shell: Rscript {0}

  style:
    runs-on: ubuntu-latest
    name: Check Code Style
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::styler
          needs: check

      - name: Check styling
        run: |
          # dry = "fail" errors if any file would be restyled
          styler::style_pkg(dry = "fail")
          cat("Code style looks good!\n")
        shell: Rscript {0}
